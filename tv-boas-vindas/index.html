<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Bem-vindo</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "Samsung One", "SamsungOne", Arial, sans-serif; color: #f6f3ea;
    background: radial-gradient(ellipse at 80% 0%, #2b7a8c 0%, transparent 55%), linear-gradient(160deg, #1f5c39 0%, #163f28 60%, #10301e 100%);
    display: flex; flex-direction: column; padding: 4.5vw 6vw;
  }
  .topo { display: flex; justify-content: space-between; align-items: flex-start; }
  .marca { font-size: 1.5vw; letter-spacing: .35em; text-transform: uppercase; color: #c8862a; font-weight: 700; }
  h1 { font-size: 4.4vw; font-weight: 700; line-height: 1.1; margin-top: 1.2vw; max-width: 55vw; }
  .sub { font-size: 1.8vw; opacity: .85; margin-top: 1vw; max-width: 55vw; }
  .hora { text-align: right; }
  .relogio { font-size: 7vw; font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; }
  .data { font-size: 1.6vw; opacity: .85; margin-top: .6vw; }
  .data::first-letter { text-transform: uppercase; }
  .tempo { font-size: 1.6vw; margin-top: 1vw; color: #f6f3ea; }
  .tempo b { font-size: 2.4vw; }
  .cartoes { display: flex; gap: 2vw; margin-top: auto; }
  .cartao { flex: 1; background: rgba(246, 243, 234, .1); border: 1px solid rgba(246, 243, 234, .18); border-radius: 1.4vw; padding: 1.8vw 2vw; }
  .cartao.wifi { flex: 1.3; background: #f6f3ea; color: #33302a; }
  .cartao h2 { font-size: 1.2vw; letter-spacing: .15em; text-transform: uppercase; color: #c8862a; margin-bottom: .8vw; }
  .cartao p { font-size: 1.7vw; line-height: 1.35; }
  .wifi p { font-size: 1.5vw; }
  .wifi strong { display: block; font-size: 2.4vw; color: #1f5c39; }
  .dica { text-align: center; font-size: 1.1vw; opacity: .6; margin-top: 2vw; }
</style>
</head>
<body>
  <div class="topo">
    <div>
      <div class="marca">Rancho Abdalla</div>
      <h1 id="titulo"></h1>
      <p class="sub" id="subtitulo"></p>
    </div>
    <div class="hora">
      <div class="relogio" id="relogio"></div>
      <div class="data" id="data"></div>
      <div class="tempo" id="tempo"></div>
    </div>
  </div>
  <div class="cartoes" id="cartoes"></div>
  <p class="dica">Aperte VOLTAR no controle para usar a TV normalmente</p>

<script src="dados.exemplo.js"></script>
<script src="dados.js"></script>
<script>
  var D = window.DADOS;
  function el(id) { return document.getElementById(id); }
  function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

  el("titulo").textContent = D.titulo;
  el("subtitulo").textContent = D.subtitulo;
  var html = '<div class="cartao wifi"><h2>Wi-Fi</h2><p>Rede<strong>' + esc(D.wifi.rede) + '</strong></p><p style="margin-top:.8vw">Senha<strong>' + esc(D.wifi.senha) + '</strong></p></div>';
  D.info.forEach(function (i) { html += '<div class="cartao"><h2>' + esc(i.titulo) + '</h2><p>' + esc(i.texto) + '</p></div>'; });
  el("cartoes").innerHTML = html;

  function relogio() {
    var a = new Date();
    el("relogio").textContent = a.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    el("data").textContent = a.toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
  }
  relogio(); setInterval(relogio, 10000);

  // Códigos do Open-Meteo (WMO) resumidos.
  function ceu(c) {
    if (c === 0) return "Céu limpo";
    if (c <= 3) return "Parcialmente nublado";
    if (c <= 48) return "Neblina";
    if (c <= 67 || (c >= 80 && c <= 82)) return "Chuva";
    if (c >= 95) return "Tempestade";
    return "Nublado";
  }
  function tempo() {
    var x = new XMLHttpRequest();
    x.open("GET", "https://api.open-meteo.com/v1/forecast?latitude=" + D.lat + "&longitude=" + D.lon +
      "&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&forecast_days=1&timezone=auto");
    x.onload = function () {
      try {
        var j = JSON.parse(x.responseText);
        el("tempo").innerHTML = "<b>" + Math.round(j.current.temperature_2m) + "°</b> " + ceu(j.current.weather_code) +
          "<br>máx " + Math.round(j.daily.temperature_2m_max[0]) + "° · mín " + Math.round(j.daily.temperature_2m_min[0]) + "°";
      } catch (e) {}
    };
    x.send();
  }
  tempo(); setInterval(tempo, 15 * 60000);

  // Botão VOLTAR (10009) fecha o app e volta para a TV.
  document.addEventListener("keydown", function (e) {
    if (e.keyCode === 10009) try { tizen.application.getCurrentApplication().exit(); } catch (err) {}
  });
</script>
</body>
</html>
