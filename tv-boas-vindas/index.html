<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Bem-vindo</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "Samsung One", "SamsungOne", Arial, sans-serif; color: #f6f3ea;
    background: radial-gradient(ellipse at 80% 0%, #2b7a8c 0%, transparent 55%), linear-gradient(160deg, #1f5c39 0%, #163f28 60%, #10301e 100%);
    display: flex; flex-direction: column; padding: 4.5vw 6vw;
  }
  .topo { display: flex; justify-content: space-between; align-items: flex-start; }
  h1 { font-size: 4.4vw; font-weight: 700; line-height: 1.1; max-width: 55vw; }
  .sub { font-size: 1.8vw; opacity: .85; margin-top: 1vw; max-width: 55vw; }
  .hora { text-align: right; }
  .relogio { font-size: 7vw; font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; }
  .data { font-size: 1.6vw; opacity: .85; margin-top: .6vw; }
  .data::first-letter { text-transform: uppercase; }
  .alexa { margin-top: auto; display: flex; align-items: center; gap: 2.4vw; background: rgba(43, 122, 140, .35); border: 1px solid rgba(246, 243, 234, .18); border-radius: 1.4vw; padding: 1.4vw 2vw; }
  .alexa h2 { font-size: 1.1vw; letter-spacing: .15em; text-transform: uppercase; color: #c8862a; white-space: nowrap; }
  .alexa p { font-size: 1.9vw; font-weight: 600; }
  .alexa span { font-size: 1.6vw; opacity: .85; }
  .cartoes { display: flex; gap: 2vw; margin-top: 2vw; }
  .cartao { flex: 1; background: rgba(246, 243, 234, .1); border: 1px solid rgba(246, 243, 234, .18); border-radius: 1.4vw; padding: 1.8vw 2vw; }
  .cartao.qr { flex: 0 0 26vw; background: #f6f3ea; color: #33302a; display: flex; gap: 1.6vw; align-items: center; }
  .qr img { width: 10vw; height: 10vw; border-radius: .6vw; flex: none; }
  .cartao h2 { font-size: 1.1vw; letter-spacing: .15em; text-transform: uppercase; color: #c8862a; margin-bottom: .8vw; }
  .cartao p { font-size: 1.5vw; line-height: 1.35; }
  .qr strong { display: block; font-size: 2.2vw; color: #1f5c39; }
  .estacao { display: none; }
  .estacao .grade { display: flex; flex-wrap: wrap; gap: 1.2vw 0; }
  .estacao .grade div { width: 33.3%; font-size: 1.1vw; color: rgba(246, 243, 234, .8); }
  .estacao .grade b { display: block; font-size: 2.4vw; font-weight: 600; opacity: 1; color: #f6f3ea; }
  .dica { text-align: center; font-size: 1.1vw; opacity: .6; margin-top: 2vw; }
</style>
</head>
<body>
  <div class="topo">
    <div>
      <h1 id="titulo"></h1>
      <p class="sub" id="subtitulo"></p>
    </div>
    <div class="hora">
      <div class="relogio" id="relogio"></div>
      <div class="data" id="data"></div>
    </div>
  </div>
  <div class="alexa"><h2>Fale com a Alexa</h2><div><p>Este quarto atende pela voz.</p><span id="frases"></span></div></div>
  <div class="cartoes" id="cartoes"></div>
  <p class="dica">Aperte VOLTAR no controle para usar a TV normalmente</p>

<script src="dados.exemplo.js"></script>
<script src="dados.js"></script>
<script>
  var D = window.DADOS;
  function el(id) { return document.getElementById(id); }
  function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

  el("titulo").textContent = D.titulo;
  el("subtitulo").textContent = D.subtitulo;
  el("frases").textContent = D.alexa.map(function (f) { return "“Alexa, " + f + "”"; }).join("   ·   ");
  var html = '<div class="cartao qr"><img src="wifi-qr.svg" alt="" onerror="this.remove()"><div><h2>Wi-Fi</h2>' +
    '<p>Rede<strong>' + esc(D.wifi.rede) + '</strong></p><p style="margin-top:.8vw">Senha<strong>' + esc(D.wifi.senha) + '</strong></p></div></div>';
  if (D.visitante) html += '<div class="cartao qr"><img src="visitante-qr.svg" alt=""><div><h2>Controle da casa</h2>' +
    '<p>Aponte a câmera e comande<strong>luzes, ar e TV</strong></p>' +
    (D.visitanteAte ? '<p style="font-size:1.1vw;opacity:.7;margin-top:.6vw">Válido até ' + esc(D.visitanteAte) + '</p>' : '') + '</div></div>';
  el("cartoes").innerHTML = html + '<div class="cartao estacao" id="estacao"><h2>Agora no rancho</h2><div class="grade" id="grade"></div></div>';

  // Estação meteorológica do HA, sem login (função pública só de leitura).
  function num(v, casas) { return v == null ? null : Number(v).toLocaleString("pt-BR", { maximumFractionDigits: casas || 0 }); }
  function estacao() {
    if (!D.supabaseKey) return;
    var x = new XMLHttpRequest();
    x.open("POST", D.supabaseUrl + "/functions/v1/dynamic-worker");
    x.setRequestHeader("Content-Type", "application/json");
    x.setRequestHeader("apikey", D.supabaseKey);
    x.setRequestHeader("Authorization", "Bearer " + D.supabaseKey);
    x.onload = function () {
      try {
        var j = JSON.parse(x.responseText);
        if (x.status !== 200 || j.temperatura_c == null) return;
        var itens = [["Temperatura", num(j.temperatura_c), "°"], ["Sensação", num(j.sensacao_c), "°"], ["Umidade", num(j.umidade_pct), "%"],
          ["Vento", num(j.vento_kmh), " km/h"], ["Chuva hoje", num(j.chuva_hoje_mm, 1), " mm"], ["UV", num(j.uv), ""]];
        el("grade").innerHTML = itens.filter(function (i) { return i[1] != null; })
          .map(function (i) { return "<div><b>" + i[1] + i[2] + "</b>" + i[0] + "</div>"; }).join("");
        el("estacao").style.display = "block";
      } catch (e) {}
    };
    x.send('{"acao":"clima_publico"}');
  }
  estacao(); setInterval(estacao, 60000);

  function relogio() {
    var a = new Date();
    el("relogio").textContent = a.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    el("data").textContent = a.toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
  }
  relogio(); setInterval(relogio, 10000);


  // Botão VOLTAR (10009) fecha o app e volta para a TV.
  document.addEventListener("keydown", function (e) {
    if (e.keyCode === 10009) try { tizen.application.getCurrentApplication().exit(); } catch (err) {}
  });
</script>
</body>
</html>
